<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.7"/></marker></defs><rect width="1200" height="590" rx="24" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="70" y="62" font-size="27" fill="#334155" font-weight="700" text-anchor="start">GraphQL은 관계를 연결하고, 각 도메인은 자신의 규칙을 판단합니다</text><text x="245" y="116" font-size="20" fill="#334155" font-weight="600" text-anchor="middle">클라이언트</text><text x="610" y="116" font-size="20" fill="#334155" font-weight="600" text-anchor="middle">GraphQL</text><text x="990" y="116" font-size="20" fill="#334155" font-weight="600" text-anchor="middle">비즈니스 기능</text><rect x="65" y="202" width="350" height="140" rx="16" fill="#edf8f6" stroke="#12837c" stroke-width="2"/><text x="240.0" y="272.0" font-size="23" fill="#12837c" font-weight="600" text-anchor="middle">post { title, author { name } }</text><text x="240.0" y="304.0" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">게시글과 작성자를 함께 요청</text><rect x="465" y="160" width="290" height="100" rx="16" fill="#fff5fc" stroke="#c52690" stroke-width="2"/><text x="610.0" y="218.0" font-size="23" fill="#c52690" font-weight="600" text-anchor="middle">Query.post Resolver</text><rect x="465" y="350" width="290" height="100" rx="16" fill="#fff5fc" stroke="#c52690" stroke-width="2"/><text x="610.0" y="408.0" font-size="23" fill="#c52690" font-weight="600" text-anchor="middle">Post.author Resolver</text><rect x="845" y="160" width="290" height="100" rx="16" fill="#edf8f6" stroke="#12837c" stroke-width="2"/><text x="990.0" y="210.0" font-size="23" fill="#12837c" font-weight="600" text-anchor="middle">PostService</text><text x="990.0" y="242.0" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">커뮤니티 · 게시글 공개 규칙</text><rect x="845" y="350" width="290" height="100" rx="16" fill="#edf8f6" stroke="#12837c" stroke-width="2"/><text x="990.0" y="400.0" font-size="23" fill="#12837c" font-weight="600" text-anchor="middle">ProfileService</text><text x="990.0" y="432.0" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">회원 관리 · 프로필 공개 규칙</text><path d="M415 235 L455 210" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M755 210 L835 210" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M755 400 L835 400" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M610 260 L610 340" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="625" y="301" font-size="17" fill="#334155" font-weight="400" text-anchor="start">반환된 게시글로</text><text x="625" y="326" font-size="17" fill="#334155" font-weight="400" text-anchor="start">author 필드 실행</text><text x="600" y="515" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">점선: 실행 엔진이 요청된 하위 필드를 처리하는 흐름입니다.</text><text x="600" y="550" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">Resolver가 다른 Resolver를 직접 호출하는 구조는 아닙니다.</text></g></svg>