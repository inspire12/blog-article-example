<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs><rect width="1200" height="920" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,sans-serif" fill="#183b66"><text x="55" y="55" font-size="30">인증 정보를 요구하고, 전달하고, 확인하기</text><text x="55" y="93" font-size="19">WWW-Authenticate는 응답에, Authorization은 요청에 담깁니다</text><rect x="65" y="125" width="240" height="65" rx="12" fill="#dfeafa"/><text x="83" y="166" font-size="21">클라이언트</text><rect x="900" y="125" width="240" height="65" rx="12" fill="#dfeafa"/><text x="918" y="166" font-size="21">Spring 서버</text><path d="M185 200 V820 M1020 200 V820" stroke="#c3cedc" stroke-dasharray="7 7"/><text x="330" y="235" font-size="22">① 인증 정보 없이 요청</text><text x="330" y="270" font-size="19">GET /auth/article</text><path d="M185 285 H1020" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="323" font-size="20">401 Unauthorized</text><path d="M1020 340 H185" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="375" font-size="17">WWW-Authenticate: Bearer realm=&quot;articles&quot;</text><text x="330" y="425" font-size="22">② 유효한 토큰으로 요청</text><text x="330" y="460" font-size="19">Authorization: Bearer demo-reader</text><path d="M185 475 H1020" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="513" font-size="20">200 OK + 보호된 본문</text><path d="M1020 530 H185" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="565" font-size="17">서버가 토큰과 필요한 권한을 확인</text><text x="330" y="615" font-size="22">③ 읽기 권한 없는 토큰으로 요청</text><text x="330" y="650" font-size="19">Authorization: Bearer demo-no-scope</text><path d="M185 665 H1020" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="703" font-size="20">403 Forbidden</text><path d="M1020 720 H185" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="755" font-size="17">WWW-Authenticate: Bearer … error=&quot;insufficient_scope&quot;</text><text x="55" y="855" font-size="21">잘못된 토큰은 401 + error=&quot;invalid_token&quot; / 권한 부족은 403</text><text x="55" y="890" font-size="17">토큰 발급은 별도 과정입니다. 토큰이 있다면 첫 요청부터 보낼 수 있습니다.</text></g></svg>