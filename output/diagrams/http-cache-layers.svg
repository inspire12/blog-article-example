<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#2563eb"/></marker></defs><rect width="1400" height="1050" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo, sans-serif" fill="#183b66"><text x="55" y="55" font-size="34" fill="#183b66">캐시는 어디에서 응답할까?</text><text x="55" y="92" font-size="22" fill="#183b66">브라우저 캐시와 CDN 캐시는 줄이는 요청의 구간이 다릅니다.</text><rect x="65" y="120" width="300" height="105" rx="15" fill="#dfeafa"/><text x="90" y="160" font-size="27" fill="#183b66">브라우저</text><text x="90" y="199" font-size="20" fill="#183b66">개인 HTTP 캐시</text><rect x="550" y="120" width="300" height="105" rx="15" fill="#dfeafa"/><text x="575" y="160" font-size="27" fill="#183b66">CDN</text><text x="575" y="199" font-size="20" fill="#183b66">공유 HTTP 캐시</text><rect x="1035" y="120" width="300" height="105" rx="15" fill="#dfeafa"/><text x="1060" y="160" font-size="27" fill="#183b66">원본 서버</text><text x="1060" y="199" font-size="20" fill="#183b66">Spring 애플리케이션</text><rect x="40" y="250" width="1320" height="195" rx="15" fill="#ffffff"/><text x="65" y="285" font-size="24" fill="#183b66">① 브라우저에 신선한 응답이 있음</text><text x="65" y="420" font-size="20" fill="#183b66">브라우저 안에서 재사용 → 외부 네트워크 요청을 생략할 수 있음</text><rect x="40" y="465" width="1320" height="195" rx="15" fill="#ffffff"/><text x="65" y="500" font-size="24" fill="#183b66">② 브라우저에는 없고, CDN에 신선한 응답이 있음</text><text x="65" y="635" font-size="20" fill="#183b66">브라우저 ↔ CDN 통신은 발생 / 원본 서버 요청은 생략</text><rect x="40" y="680" width="1320" height="195" rx="15" fill="#ffffff"/><text x="65" y="715" font-size="24" fill="#183b66">③ 재검증이 원본 서버까지 필요한 경우</text><text x="65" y="850" font-size="20" fill="#183b66">조건부 요청을 원본까지 전달 → 변경 없으면 304, 바뀌었으면 200 + 새 본문</text><rect x="80" y="310" width="270" height="65" rx="15" fill="#dcfce7"/><text x="100" y="350" font-size="23" fill="#183b66">저장된 본문 사용</text><text x="565" y="350" font-size="23" fill="#77869a">요청 없음</text><text x="1050" y="350" font-size="23" fill="#77869a">요청 없음</text><path d="M220 545 H690" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="530" font-size="19" fill="#183b66">요청</text><path d="M690 590 H220" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="575" font-size="19" fill="#183b66">저장된 응답</text><text x="1045" y="570" font-size="23" fill="#77869a">요청 없음</text><path d="M220 760 H690" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="745" font-size="19" fill="#183b66">If-None-Match: &quot;v1&quot;</text><path d="M710 760 H1180" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="745" font-size="19" fill="#183b66">If-None-Match: &quot;v1&quot;</text><path d="M1180 810 H710" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="795" font-size="19" fill="#183b66">304 / 200 + 새 본문</text><path d="M690 810 H220" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="795" font-size="19" fill="#183b66">재사용할 응답 전달</text><text x="55" y="920" font-size="21" fill="#183b66">CDN 저장이 허용된 공개 응답의 예시입니다. private 응답은 CDN에 저장하지 않습니다.</text><text x="55" y="958" font-size="19" fill="#183b66">③ CDN이 304를 받으면 저장된 본문으로 응답할 수 있습니다. 브라우저의 조건에 따라 200 또는 304가 됩니다.</text><text x="55" y="996" font-size="19" fill="#183b66">일반적인 캐시 사용 요청 기준이며, 새로고침·캐시 우회 요청에서는 동작이 달라질 수 있습니다.</text></g></svg>