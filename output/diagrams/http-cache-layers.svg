<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#2563eb"/></marker></defs><rect width="1200" height="1100" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,sans-serif" fill="#183b66"><text x="50" y="52" font-size="31">브라우저는 언제 서버에 다시 요청할까?</text><text x="50" y="88" font-size="21">저장된 응답의 신선도와 Cache-Control에 따라 달라집니다.</text><rect x="50" y="112" width="1100" height="92" rx="14" fill="#e3ecfa"/><text x="75" y="145" font-size="20">처음 받은 응답의 정책</text><text x="75" y="183" font-size="25">Cache-Control: private, max-age=60, must-revalidate</text><rect x="75" y="225" width="300" height="82" rx="14" fill="#dfeafa"/><text x="95" y="260" font-size="25">브라우저</text><text x="95" y="288" font-size="19">개인 HTTP 캐시</text><rect x="825" y="225" width="300" height="82" rx="14" fill="#dfeafa"/><text x="845" y="260" font-size="25">서버</text><text x="845" y="288" font-size="19">현재 글과 ETag 관리</text><rect x="40" y="330" width="1120" height="170" rx="14" fill="#ffffff"/><text x="65" y="365" font-size="24">① 응답 나이 30초: 신선한 응답 재사용</text><rect x="40" y="520" width="1120" height="240" rx="14" fill="#ffffff"/><text x="65" y="555" font-size="24">② 응답 나이 70초: 재검증 필요</text><rect x="40" y="780" width="1120" height="170" rx="14" fill="#ffffff"/><text x="65" y="815" font-size="24">③ 재검증 결과에 따라 본문 사용</text><rect x="80" y="387" width="280" height="60" rx="14" fill="#dcfce7"/><text x="100" y="425" font-size="23">저장된 본문 사용</text><text x="665" y="425" font-size="23">서버로 요청하지 않을 수 있음</text><text x="65" y="478" font-size="20">서버에서 글을 수정했더라도 브라우저에 자동으로 알려지지는 않습니다.</text><path d="M225 610 H975" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="355" y="597" font-size="20">If-None-Match: W/&quot;v1&quot;</text><path d="M975 674 H225" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="355" y="661" font-size="20">304 또는 200 + 새 본문</text><text x="65" y="730" font-size="20">must-revalidate: 신선도가 지난 응답은 성공적인 재검증 없이 재사용할 수 없음</text><text x="80" y="856" font-size="23">변경 없음 → 304 → 저장된 본문 재사용</text><text x="80" y="900" font-size="23">변경 있음 → 200 + 새 본문·ETag → 캐시 갱신</text><text x="55" y="990" font-size="22">다른 정책을 사용한다면</text><text x="55" y="1025" font-size="21">no-cache: 재사용 전 매번 재검증  /  no-store: 응답 저장 금지</text><text x="55" y="1062" font-size="18">일반적인 캐시 사용 요청 기준. 시간이 지났다고 자동으로 요청하거나 캐시를 삭제하지는 않습니다.</text></g></svg>