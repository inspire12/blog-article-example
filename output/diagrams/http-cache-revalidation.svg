<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs><rect width="1200" height="920" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,sans-serif" fill="#183b66"><text x="55" y="55" font-size="30">캐시 재사용과 재검증은 다른 흐름입니다</text><text x="55" y="93" font-size="19">no-cache 예제: 매번 확인하되, 바뀌지 않았다면 본문을 다시 받지 않습니다</text><rect x="65" y="125" width="240" height="65" rx="12" fill="#dfeafa"/><text x="83" y="166" font-size="21">클라이언트 / 캐시</text><rect x="900" y="125" width="240" height="65" rx="12" fill="#dfeafa"/><text x="918" y="166" font-size="21">Spring 서버</text><path d="M185 200 V820 M1020 200 V820" stroke="#c3cedc" stroke-dasharray="7 7"/><text x="330" y="235" font-size="22">① 최초 조회</text><text x="330" y="270" font-size="19">GET /cache/article</text><path d="M185 285 H1020" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="323" font-size="20">200 + ETag: W/&quot;v1&quot; + 본문</text><path d="M1020 340 H185" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="375" font-size="17">Cache-Control: no-cache, private → 본문과 검증자 저장</text><text x="330" y="425" font-size="22">② 변경 없음</text><text x="330" y="460" font-size="19">GET + If-None-Match: W/&quot;v1&quot;</text><path d="M185 475 H1020" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="513" font-size="20">304 Not Modified · 본문 없음</text><path d="M1020 530 H185" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="565" font-size="17">네트워크 왕복은 발생 / 저장했던 본문 재사용</text><text x="330" y="615" font-size="22">③ 서버 데이터 수정 후</text><text x="330" y="650" font-size="19">GET + If-None-Match: W/&quot;v1&quot;</text><path d="M185 665 H1020" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="703" font-size="20">200 + ETag: W/&quot;v2&quot; + 새 본문</text><path d="M1020 720 H185" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="330" y="755" font-size="17">PUT으로 제목 변경 → 이전 태그와 다르므로 새 응답 저장</text><text x="55" y="855" font-size="21">max-age=60인 신선한 캐시를 재사용하면 서버 요청 자체를 생략할 수 있습니다.</text><text x="55" y="890" font-size="17">도식의 v1·v2는 설명용입니다. 실제 예제는 변경마다 새 UUID 검증자를 만듭니다.</text></g></svg>